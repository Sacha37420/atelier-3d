version: "3.9"

# Le démon Docker de ce lab est distant (filesystem séparé de l'hôte code-server) :
# les bind mounts de code sont inertes, tout le code est baké dans les images
# (COPY dans les Dockerfiles) — toute modif nécessite un rebuild.

networks:
  sso-net:
    external: true
    name: sso-lab_sso-net
  dev-net:
    external: true
    name: dev-net
  atelier3d-net:
    driver: bridge

volumes:
  # Répertoire de travail des jobs (bases COLMAP, nuages de points denses,
  # images redimensionnées) — plusieurs Go par job, mais purement transitoire.
  # NON 'external' à dessein (même raisonnement que `downloads` de robot-lab,
  # cf. CLAUDE.md) : clean2.sh peut le vider sans rien perdre, ces fichiers
  # n'ont aucune valeur une fois le job terminé. Les photos/maillages durables
  # vivent désormais dans l'app storage (cf. backend/api/storage_backend.py) —
  # ce n'est plus un volume média privé.
  atelier3d-scratch:

services:

  redis:
    image: redis:7-alpine
    container_name: atelier-3d-redis
    restart: unless-stopped
    networks:
      - atelier3d-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: atelier-3d-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8092:8000"
    networks:
      - sso-net
      - dev-net
      - atelier3d-net
    volumes:
      - atelier3d-scratch:/app/scratch
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/atelier-3d-api/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 8000}}"

  worker:
    build: ./backend
    container_name: atelier-3d-worker
    restart: unless-stopped
    env_file: .env
    # Un seul job lourd actif à la fois pour toute l'app (verrou global, cf.
    # to_do_3D.md) : concurrency=1 est le filet de sécurité derrière le verrou
    # applicatif DB posé dans ReconstructionLaunchView. Le CPU (2 vCPU) est
    # partagé avec le reste du lab.
    command: celery -A config worker --loglevel=info --concurrency=1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sso-net   # pour obtenir un token du compte de service (keycloak:8080) —
                  # storage-backend, lui, est déjà atteignable via dev-net ci-dessous
      - dev-net   # pour atteindre l'instance Postgres partagée et storage-backend
      - atelier3d-net
    volumes:
      - atelier3d-scratch:/app/scratch

  frontend:
    build: ./frontend
    container_name: atelier-3d-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "4210:80"
    networks:
      - sso-net
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/atelier-3d/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 80}}"
